<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JL0C3QP4F5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-JL0C3QP4F5');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{canonical_url}}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{canonical_url}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-P83HHFVH');</script>
  <!-- End Google Tag Manager -->

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9534887202409405" crossorigin="anonymous"></script>

  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {{json_ld}}
  </script>

  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    :root {
      --emoji-font: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Android Emoji", "Segoe UI Symbol", "Twemoji Mozilla", emoji, sans-serif;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif, var(--emoji-font);
    }
    .custom-horizontal-scrollbar {
      scrollbar-width: thin !important;
      scrollbar-color: #64748b #e2e8f0 !important;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overflow-x: auto !important;
    }
    .custom-horizontal-scrollbar::-webkit-scrollbar {
      height: 10px !important;
      display: block !important;
    }
    .custom-horizontal-scrollbar::-webkit-scrollbar-track {
      background: #e2e8f0 !important;
      border-radius: 9999px !important;
    }
    .custom-horizontal-scrollbar::-webkit-scrollbar-thumb {
      background: #64748b !important;
      border-radius: 9999px !important;
      border: 2px solid #e2e8f0 !important;
    }
    .custom-horizontal-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155 !important;
    }
    .dark .custom-horizontal-scrollbar {
      scrollbar-color: #60a5fa #1e293b !important;
    }
    .dark .custom-horizontal-scrollbar::-webkit-scrollbar-track {
      background: #1e293b !important;
      border-radius: 9999px !important;
    }
    .dark .custom-horizontal-scrollbar::-webkit-scrollbar-thumb {
      background: #60a5fa !important;
      border-radius: 9999px !important;
      border: 2px solid #1e293b !important;
    }
    .dark .custom-horizontal-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #93c5fd !important;
    }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P83HHFVH" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  {{header}}

  <main class="max-w-4xl mx-auto px-4 py-8">
    {{breadcrumbs}}

    <article class="space-y-8">
      <header class="border-b border-neutral-200 pb-6">
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-neutral-900 mb-4">{{h1}}</h1>
        <div class="flex flex-wrap items-center gap-4 text-sm text-neutral-500">
          <span>By {{author}}</span>
          <span>•</span>
          <span>Published {{publishedDate}}</span>
          <span>•</span>
          <span>{{readingTime}}</span>
        </div>
      </header>

      <!-- Ad Slot -->
      <div class="min-h-[90px] flex items-center justify-center bg-neutral-100/80 rounded-xl p-2 my-6 border border-dashed border-neutral-300" aria-label="Advertisement">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9534887202409405" data-ad-slot="6477240404" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

      <!-- Content Sections -->
      <div class="space-y-6 text-neutral-800 leading-relaxed text-base md:text-lg">
        {{content_sections_html}}
      </div>

      <!-- Relevant Emojis -->
      <section class="bg-white rounded-2xl p-6 shadow-xs border border-neutral-200 space-y-4">
        <h2 class="text-xl font-bold text-neutral-900">Featured Emojis in This Guide</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
          {{relevant_emojis_html}}
        </div>
      </section>

      <!-- FAQs -->
      <section class="bg-white rounded-2xl p-6 shadow-xs border border-neutral-200 space-y-4">
        <h2 class="text-xl font-bold text-neutral-900">Frequently Asked Questions</h2>
        <div class="space-y-4">
          {{faqs_html}}
        </div>
      </section>
    </article>
  </main>

  {{footer}}
</body>
</html>
